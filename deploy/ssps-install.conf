# SSPS Ubuntu install/update config.
# Edit this file, then rerun scripts/install-ubuntu.sh to apply config changes.

SSPS_SERVICE_NAME=ssps
SSPS_USER=ssps
SSPS_GROUP=ssps

SSPS_INSTALL_DIR=/opt/ssps
SSPS_DATA_DIR=/var/lib/ssps
SSPS_BINARY=/opt/ssps/ssps
SSPS_ENV_FILE=/etc/default/ssps

SSPS_ADDR=127.0.0.1:8080
SSPS_DB_PATH=/var/lib/ssps/ssps.db
SSPS_FLUSH_INTERVAL=30m
SSPS_DB_CHECKPOINT_INTERVAL=5m
SSPS_DB_COMPACT_INTERVAL=24h
SSPS_WS_UPDATE_INTERVAL=30s

SSPS_LIMIT_NOFILE=1048576
SSPS_TASKS_MAX=infinity

SSPS_ENABLE_SYSCTL=1
SSPS_SYSCTL_FILE=/etc/sysctl.d/99-ssps.conf
SSPS_SYSCTL_FILE_MAX=2000000
SSPS_SYSCTL_NR_OPEN=2000000
SSPS_SYSCTL_SOMAXCONN=65535
SSPS_SYSCTL_TCP_MAX_SYN_BACKLOG=65535

SSPS_APT_PACKAGES="build-essential ca-certificates curl golang sqlite3 libsqlite3-0 libsqlite3-dev"
SSPS_RUN_TESTS=1
SSPS_HEALTH_URL=http://127.0.0.1:8080/healthz
SSPS_HEALTH_RETRIES=12
SSPS_HEALTH_RETRY_DELAY=2
